name: Group DevOps Pipeline (Vite + React)

on:
  push:
    branches:
      - 'dept/ECE' # Change this to your EXACT branch name
  pull_request:
    branches:
      - 'dept/ECE'

jobs:
  # --- STAGE 1: QUALITY GATE (LINT & TYPES) ---
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting and Type Checks
        id: checker
        run: |
          mkdir -p logs
          
          # 1. LINT ONLY YOUR GROUP'S FILES
          # We use the exact casing (Pages) from your terminal
          npx eslint \
            src/Pages/admin/ECEAdmin.tsx \
            src/Pages/departments/ECE.tsx \
            --format json > logs/lint_error.txt 2>&1 || (echo "LINT_FAIL=true" >> $GITHUB_ENV && exit 1)

          # 2. TYPE-CHECK (The "Safe" way for shared repos)
          # We run tsc but add '|| true'. 
          # This allows the pipeline to continue even if other departments have broken code.
          npx tsc -b > logs/ts_error.txt 2>&1 || (echo "Classmate TS errors ignored, moving to build..." && true)
      
      - name: Run Smoke Tests (External)
        run: |
          npx vitest run > logs/test_error.txt 2>&1 || (echo "TEST_FAIL=true" >> $GITHUB_ENV && exit 1)

  # --- STAGE 2: BUILD, TEST, AND DEPLOY ---
  build-and-deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test inside Docker
        run: |
          # 1. Create a clean, lowercase tag from your branch name
          # This turns "dept/ECE" into "dept-ece"
          SAFE_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          IMAGE_ID="ghcr.io/${{ github.repository_owner }}/webeng-ece:$SAFE_TAG"
          
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV
          echo "Building image: $IMAGE_ID"

          # 2. Build the production-ready image
          docker build -t $IMAGE_ID .
          
          # 3. Verify it works by running the build command inside
          docker run --rm $IMAGE_ID npm run build

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:latest'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        if: github.ref == 'refs/heads/dept/ECE' && success()
        run: docker push ${{ env.IMAGE_ID }}

      - name: Trigger Render Deployment
        if: github.ref == 'refs/heads/dept/ECE' && success()
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  # --- STAGE 3: AUTOMATIC ERROR FEEDBACK (The "Bot") ---
  feedback:
    needs: [quality-gate, build-and-deploy]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (to access logs if needed)
        uses: actions/checkout@v4

      - name: Post Error Feedback to PR
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ❌ **DevOps Alert: Build/Test Failed for Group X**
            
            The pipeline was blocked. Below is a summary of the errors detected:
            
            > [!IMPORTANT]
            > Please check the **Actions Tab** for the full log. 
            > Common fixes: Run `npm run lint` or `npx tsc` locally.
            
            🔗 [View Detailed Logs and Error Line Numbers](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})