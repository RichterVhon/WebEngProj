name: Group DevOps Pipeline (Vite + React)

on:
  push:
    branches:
      - 'dept/ECE'
  pull_request:
    branches:
      - 'dept/ECE'
  workflow_dispatch:

jobs:
  # --- STAGE 1: QUALITY GATE (LINT & TYPES) ---
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting and Type Checks
        id: checker
        run: |
          mkdir -p logs
          
          # 1. LINT ONLY YOUR GROUP'S FILES
          npx eslint \
            src/Pages/admin/ECEAdmin.tsx \
            src/Pages/departments/ECE.tsx \
            --format json > logs/lint_error.txt 2>&1 || (echo "LINT_FAIL=true" >> $GITHUB_ENV && exit 1)

          # 2. TYPE-CHECK (The "Safe" way for shared repos)
          npx tsc -b > logs/ts_error.txt 2>&1 || (echo "Classmate TS errors ignored, moving to build..." && true)
      
      - name: Run Smoke Tests (External)
        run: |
          npx vitest run > logs/test_error.txt 2>&1 || (echo "TEST_FAIL=true" >> $GITHUB_ENV && exit 1)

  # --- STAGE 2: BUILD, TEST, AND DEPLOY ---
  build-and-deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test inside Docker
        run: |
          # 1. DYNAMIC LOWERCASE NAMING
          # Works on your fork OR the original repo automatically
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SAFE_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          
          # We use 'webeng-ece' as a unique package name to avoid overwriting others
          IMAGE_ID="ghcr.io/$OWNER_LOWER/webeng-ece:$SAFE_TAG"
          
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV
          echo "Building image: $IMAGE_ID"

          # 2. Build the image
          docker build -t $IMAGE_ID .
          
          # 3. VERIFICATION (Checking for build artifacts instead of running npm)
          docker run --rm $IMAGE_ID ls /usr/share/nginx/html

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_ID }} 
          format: 'table'
          exit-code: '0' 
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        if: github.ref == 'refs/heads/dept/ECE' && success()
        run: docker push ${{ env.IMAGE_ID }}

      - name: Trigger Render Deployment
        # We check the environment variable instead of the secret directly
        if: github.ref == 'refs/heads/dept/ECE' && success() && env.RENDER_URL != ''
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Deployment..."
          curl -X POST "$RENDER_URL"

  # --- STAGE 3: AUTOMATIC ERROR FEEDBACK ---
  feedback:
    needs: [quality-gate, build-and-deploy]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post Error Feedback to PR
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ❌ **DevOps Alert: Build/Test Failed for ECE Department**
            
            The pipeline was blocked. Please check the logs for:
            1. **Linter Errors** in ECE files.
            2. **Docker Build** failures.
            
            🔗 [View Detailed Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})